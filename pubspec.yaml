name: talksnap
description: Mensageiro P2P descentralizado baseado em toxcore (FFI).
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  # ffi: fornece utilitários extras (malloc, Utf8, etc.) sobre dart:ffi puro.
  ffi: ^2.1.3
  # path_provider: resolve o diretório de dados do app para persistir a
  # identidade Tox (savedata) entre execuções (Fase 1).
  path_provider: ^2.1.4
  drift: ^2.34.4
  path: ^1.9.1
  flutter_riverpod: ^2.6.1
  drift_flutter: ^0.3.1
  file_picker: ^12.2.0
  url_launcher: ^6.3.2
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.34.6
  build_runner: ^2.16.1

flutter:
  uses-material-design: true
